name: daily-monitor

on:
  schedule:
    - cron: "17 2 * * *"   # 07:47 IST every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-v1

      - name: Check new complaints and update the dashboard
        run: python -m monitor.run

      - name: Evaluate the published model on held-out complaints
        run: python -m monitor.evaluate

      - name: Commit results
        run: |
          git config user.name "Hardik Bahri"
          git config user.email "hardik.bahri@gmail.com"
          git add data reports state history.csv eval_history.csv README.md
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "$(cat .commit_msg)"
            git push
          fi
